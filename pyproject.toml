[project]
name = "compass"
version = "0.2.0"
description = "An evidence-conditioned decision model serving the /v1/systemone contract"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "huggingface-hub>=1.32.0",
    "peft>=0.21.0",
    "safetensors>=0.8.0",
    "torch>=2.6",
    "transformers>=5",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["compass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
